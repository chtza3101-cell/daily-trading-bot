name: 晨間 AI 看盤機器人

on:
  schedule:
    - cron: '30 22 * * 0-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 取得最新的程式碼
        uses: actions/checkout@v4  # <--- 這裡從 v3 升級成 v4
        
      - name: 準備 Python 環境
        uses: actions/setup-python@v5  # <--- 這裡從 v4 升級成 v5
        with:
          python-version: '3.10'
          
      - name: 安裝所需套件
        run: pip install -r requirements.txt
        
      - name: 執行 AI 推播機器人
        run: python daily_scan_bot.py
