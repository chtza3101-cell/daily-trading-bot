name: 晨間 AI 看盤機器人

on:
  schedule:
    # 這裡是 UTC 時間。台灣時間早上 06:30，相當於 UTC 時間前一天晚上的 22:30。
    # 0-4 代表台灣時間的週二到週六早上執行 (對應美股週一到週五的收盤)
    - cron: '30 22 * * 0-4'
  workflow_dispatch: # 讓你可以隨時手動點擊測試

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 取得最新的程式碼
        uses: actions/checkout@v3
        
      - name: 準備 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: 安裝所需套件
        run: pip install -r requirements.txt
        
      - name: 執行 AI 推播機器人
        run: python daily_scan_bot.py
